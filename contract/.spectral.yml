extends: ["spectral:oas"]
rules:
  version-required:
    description: info.1.0.0
    severity: error
    given: $.info
    then:
      field: version
      function: truthy
  operation-id-required:
    description: 05
    severity: error
    given: $.paths[*][get,post,put,patch,delete]
    then:
      field: operationId
      function: truthy
